# Lazygit

# Custom build for stage-hunks-in-main-view feature
# https://github.com/jesseduffield/lazygit/issues/5974
#
# go install github.com/jesseduffield/lazygit@sh-integration
# cargo install --git ssh://git@github.com/stefanhaller/difftastic.git --branch osc-1717-metadata
# cargo install --git ssh://git@github.com/stefanhaller/delta.git --branch osc-1717-metadata
# diff-so-fancy fork: ~/src/stefanhaller/diff-so-fancy (osc-1717-metadata), linked into ~/.local/bin via stow

git:
  # https://github.com/jesseduffield/lazygit/blob/master/docs/Config.md#custom-git-log-command
  # Add --oneline to default command
  branchLogCmd: "git log --graph --color=always --abbrev-commit --decorate --date=relative --pretty=medium --oneline {{branchName}} --"
  log:
    showWholeGraph: false
  overrideGpg: true
  branchPrefix: "jabid/"
  autoFetch: false
  diffContextSize: 5
  # https://github.com/jesseduffield/lazygit/blob/master/docs/Custom_DiffRenderers.md
  # Cycle renderers with the `|` key
  diffRenderers:
    - command: diff-so-fancy
    - command: delta --dark --paging=never
    - type: extDiff
      command: difft --color=always --context={{diffContext}}

customCommands:

  - key: "y"
    command: "printf %s {{.SelectedLocalBranch.Name | quote}} | pbcopy"
    context: "localBranches"
    description: "Copy branch name"
    output: none

  - key: "F"
    command: "git fixup"
    context: "files"
    description: "Run git fixup"

  - key: "e"
    command: 'if [ -d "{{.SelectedPath}}" ]; then yazi "{{.SelectedPath}}"; else zed "{{.SelectedPath}}"; fi'
    context: "files"
    description: "Open in yazi/zed"
    output: none

  # https://github.com/jesseduffield/lazygit/blob/master/docs/Custom_Command_Keybindings.md#menus-of-custom-commands
  - key: "h" # h for hub in Github.
    description: "GitHub"
    commandMenu:
      - key: "c"
        command: "gh pr create --fill"
        context: "localBranches"
        description: "Create PR"
        loadingText: "Creating PR..."
        output: none
      - key: "v"
        command: "gh pr view --web"
        context: "global"
        description: "View PR in browser"
        output: none
      - key: "l"
        command: "gh pr list --limit 50"
        context: "global"
        description: "List PRs"
        output: popup
        outputTitle: "Pull requests"
      - key: "i"
        command: "gh issue list --limit 50"
        context: "global"
        description: "List issues"
        output: popup
        outputTitle: "Issues"
      - key: "w"
        command: "gh run list --limit 15"
        context: "global"
        description: "Workflow runs"
        output: popup
        outputTitle: "Workflow runs"
      - key: "k"
        command: "gh pr checks"
        context: "global"
        description: "PR checks"
        output: popup
        outputTitle: "PR checks"
      - key: "y"
        command: "gh pr view --json url --jq .url | tr -d '\n' | pbcopy"
        context: "global"
        description: "Copy PR URL"
        output: none
      - key: "o"
        command: "git open"
        context: "global"
        description: "Open repo on GitHub"
        output: none
      - key: "b"
        command: "gh browse {{.SelectedPath}}"
        context: "files"
        description: "Open selected file on GitHub"
        output: none

gui:
  nerdFontsVersion: "3"
  authorColors:
    "Jaseem Abid": "#32F5DD"
    "*": "#D7A94F"
  showDivergenceFromBaseBranch: arrowAndNumber
  filterMode: fuzzy
  shrinkSidePanelsToContent: true

os:
  editPreset: "zed"
  openDirInEditor: "yazi {{dir}}"

# https://github.com/jesseduffield/lazygit/blob/master/docs/keybindings/Custom_Keybindings.md
# Disable h/l for panel movement (arrows and tab still work)
keybinding:
  universal:
    prevBlock-alt: <disabled>
    nextBlock-alt: <disabled>
  files:
    toggleStagedAll: <disabled>

disableStartupPopups: true
promptToReturnFromSubprocess: false
notARepository: skip
