[[plugin.prepend_previewers]]
group = "file"
url = "*.md"
run = 'piper -- CLICOLOR_FORCE=1 glow -w=$w -s=dark "$1"'

[[plugin.prepend_previewers]]
group = "file"
mime = "text/html"
run = 'piper -- w3m -T text/html -dump "$1"'

# Bat for all text files not matched by one of the rules above
[[plugin.prepend_previewers]]
mime = "text/*"
run = 'piper -- bat --plain --color=always --paging=never --terminal-width="$w" "$1"'

[[plugin.prepend_fetchers]]
group = "file"
id = "git"
url = "*"
run = "git"

[[plugin.prepend_fetchers]]
group = "file"
id = "git"
url = "*/"
run = "git"

[preview]
max_width = 2000
max_height = 2000

[opener]
edit = [{ run = '/opt/homebrew/bin/zed %s', desc = "Zed" }]

[[opener.bulk-rename]]
run = 'nvim "%s"'
block = true

[[open.prepend_rules]]
url = "bulk-rename.txt"
use = "bulk-rename"

[mgr]
show_hidden = true
ratio = [1, 2, 4]
